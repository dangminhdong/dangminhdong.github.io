<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Ảnh lên GitHub & CDN</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #2ea44f; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 6px; font-size: 16px; }
        button:hover { background-color: #2c974b; }
        #result { margin-top: 20px; word-break: break-all; }
        img { max-width: 100%; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
        .link-box { background: #f6f8fa; padding: 10px; border-radius: 6px; border: 1px solid #d0d7de; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Upload Ảnh lên GitHub + CDN</h2>

    <div class="form-group">
        <label>GitHub Token:</label>
        <input type="password" id="token" placeholder="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">
    </div>

    <div class="form-group">
        <label>Tên Username GitHub:</label>
        <input type="text" id="username" placeholder="dangminhdong">
    </div>

    <div class="form-group">
        <label>Tên Repository:</label>
        <input type="text" id="repo" placeholder="Joe">
    </div>

    <div class="form-group">
        <label>Chọn Ảnh:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button onclick="uploadImage()">Tải Ảnh Lên</button>

    <div id="status"></div>
    <div id="result"></div>

    <script>
        // Tự động tải thông tin đã lưu trước đó nếu có
        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem("gh_token")) document.getElementById("token").value = localStorage.getItem("gh_token");
            if(localStorage.getItem("gh_username")) document.getElementById("username").value = localStorage.getItem("gh_username");
            if(localStorage.getItem("gh_repo")) document.getElementById("repo").value = localStorage.getItem("gh_repo");
        });

        async function uploadImage() {
            const token = document.getElementById('token').value.trim();
            const username = document.getElementById('username').value.trim();
            const repo = document.getElementById('repo').value.trim();
            const fileInput = document.getElementById('imageInput');
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');

            if (!token || !username || !repo || fileInput.files.length === 0) {
                alert('Vui lòng điền đầy đủ thông tin và chọn ảnh!');
                return;
            }

            // Lưu cấu hình vào LocalStorage để lần sau không cần nhập lại
            localStorage.setItem("gh_token", token);
            localStorage.setItem("gh_username", username);
            localStorage.setItem("gh_repo", repo);

            const file = fileInput.files[0];
            const fileName = `images/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

            statusDiv.innerHTML = '<p>Đang tải ảnh lên...</p>';
            resultDiv.innerHTML = '';

            try {
                // Chuyển file sang chuỗi Base64
                const base64Content = await convertBase64(file);
                const cleanBase64 = base64Content.split(',')[1];

                // Gửi request tới GitHub API
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Upload image: ${fileName}`,
                        content: cleanBase64
                    })
                });

                if (response.ok) {
                    // Cấu trúc URL CDN thông qua jsDelivr
                    const cdnUrl = `https://cdn.jsdelivr.net/gh/${username}/${repo}@main/${fileName}`;
                    
                    statusDiv.innerHTML = '<p style="color: green;">Upload thành công!</p>';
                    resultDiv.innerHTML = `
                        <div class="link-box">
                            <strong>Link CDN:</strong><br>
                            <a href="${cdnUrl}" target="_blank" id="cdnLink">${cdnUrl}</a>
                            <br><br>
                            <button onclick="navigator.clipboard.writeText('${cdnUrl}')">Sao chép Link</button>
                        </div>
                        <br>
                        <img src="${cdnUrl}" alt="Uploaded Image">
                    `;
                } else {
                    const errData = await response.json();
                    statusDiv.innerHTML = `<p style="color: red;">Lỗi: ${errData.message}</p>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<p style="color: red;">Lỗi kết nối: ${err.message}</p>`;
            }
        }

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const fileReader = new FileReader();
                fileReader.readAsDataURL(file);
                fileReader.onload = () => resolve(fileReader.result);
                fileReader.onerror = (error) => reject(error);
            });
        }
    </script>
</body>
</html>
