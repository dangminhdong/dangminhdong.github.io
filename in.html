<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Image CDN Uploader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f17;
            --card-bg: #111827;
            --input-bg: #1f293d;
            --border-color: #2e3a52;
            --border-focus: #6366f1;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-success: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 580px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 1.5rem;
            }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Drop Zone UI */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-align: center;
            background-color: rgba(31, 41, 61, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-primary);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .drop-zone-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 0.75rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
        }

        .drop-zone-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .drop-zone-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .file-info-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 0.75rem;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: var(--text-main);
        }

        /* Action Button */
        .btn-submit {
            width: 100%;
            background-color: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.5rem;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #4f46e5;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Upload Progress Area */
        .progress-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: rgba(31, 41, 61, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .progress-title {
            font-weight: 600;
            color: var(--text-main);
        }

        .progress-stats {
            font-family: var(--font-code);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
            border-radius: 4px;
            transition: width 0.15s ease-out;
        }

        /* Result Section */
        .result-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-success);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .copy-input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-success);
            font-family: var(--font-code);
            font-size: 0.85rem;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            outline: none;
        }

        .btn-copy {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .preview-img-container {
            text-align: center;
            margin-top: 1rem;
            background: #000;
            border-radius: 8px;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            object-fit: contain;
        }

        .error-message {
            display: none;
            margin-top: 1rem;
            padding: 0.85rem 1rem;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: var(--font-code);
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-tag">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            CDN Edge Engine
        </div>
        <h1>GitHub Asset Storage</h1>
        <p>Tải ảnh cực nhanh lên GitHub Repository & phân phối qua jsDelivr CDN</p>
    </div>

    <!-- Credentials Section -->
    <div class="form-group">
        <label for="token">GitHub Access Token</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx">
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="username">GitHub Username</label>
            <input type="text" id="username" placeholder="vd: octocat">
        </div>
        <div class="form-group">
            <label for="repo">Repository Name</label>
            <input type="text" id="repo" placeholder="vd: cdn-images">
        </div>
    </div>

    <!-- File Drop Zone -->
    <div class="drop-zone" id="dropZone">
        <input type="file" id="imageInput" accept="image/*">
        <div class="drop-zone-icon">
            <svg class="icon" style="width: 24px; height: 24px;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="drop-zone-title">Kéo & Thả tập tin vào đây hoặc nhấp để chọn</div>
        <div class="drop-zone-desc">Hỗ trợ PNG, JPG, WEBP, GIF (Tối đa 25MB)</div>
        <div id="fileInfoBadge" style="display: none;"></div>
    </div>

    <button class="btn-submit" id="uploadBtn" onclick="startUpload()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Tải Ảnh Lên GitHub
    </button>

    <!-- Error Display -->
    <div class="error-message" id="errorMessage"></div>

    <!-- AJAX Upload Progress -->
    <div class="progress-box" id="progressBox">
        <div class="progress-header">
            <span class="progress-title" id="progressStatus">Đang xử lý tập tin...</span>
            <span class="progress-stats" id="progressStats">0 KB / 0 KB (0%)</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
    </div>

    <!-- Result Box -->
    <div class="result-box" id="resultBox">
        <div class="result-title">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Upload hoàn tất & Đã khởi tạo CDN Link!
        </div>
        <div class="copy-group">
            <input type="text" class="copy-input" id="cdnUrlInput" readonly>
            <button class="btn-copy" onclick="copyCdnUrl()" id="copyBtn">Copy Link</button>
        </div>
        <div class="preview-img-container">
            <img src="" alt="Uploaded Preview" class="preview-img" id="previewImg">
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem("gh_token")) document.getElementById("token").value = localStorage.getItem("gh_token");
        if(localStorage.getItem("gh_username")) document.getElementById("username").value = localStorage.getItem("gh_username");
        if(localStorage.getItem("gh_repo")) document.getElementById("repo").value = localStorage.getItem("gh_repo");
    });

    const fileInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const fileInfoBadge = document.getElementById('fileInfoBadge');

    // Drag & Drop Handling
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });

    fileInput.addEventListener('change', updateFileBadge);

    function updateFileBadge() {
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            fileInfoBadge.style.display = 'inline-flex';
            fileInfoBadge.className = 'file-info-badge';
            fileInfoBadge.innerHTML = `📄 ${file.name} (${formatBytes(file.size)})`;
        }
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function startUpload() {
        const token = document.getElementById('token').value.trim();
        const username = document.getElementById('username').value.trim();
        const repo = document.getElementById('repo').value.trim();
        const uploadBtn = document.getElementById('uploadBtn');
        const errorMsg = document.getElementById('errorMessage');
        const progressBox = document.getElementById('progressBox');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressStatus = document.getElementById('progressStatus');
        const progressStats = document.getElementById('progressStats');
        const resultBox = document.getElementById('resultBox');

        errorMsg.style.display = 'none';
        resultBox.style.display = 'none';

        if (!token || !username || !repo || fileInput.files.length === 0) {
            showError('Vui lòng điền đầy đủ thông tin Access Token, Username, Repo và chọn ảnh!');
            return;
        }

        localStorage.setItem("gh_token", token);
        localStorage.setItem("gh_username", username);
        localStorage.setItem("gh_repo", repo);

        const file = fileInput.files[0];
        const totalSize = file.size;
        const fileName = `images/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

        uploadBtn.disabled = true;
        progressBox.style.display = 'block';
        progressBarFill.style.width = '0%';
        progressStatus.textContent = 'Đang đọc tập tin...';
        progressStats.textContent = `0 KB / ${formatBytes(totalSize)} (0%)`;

        const reader = new FileReader();

        // Stage 1: File Reading Progress
        reader.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 25);
                progressBarFill.style.width = percent + '%';
                progressStats.textContent = `${formatBytes(e.loaded)} / ${formatBytes(totalSize)} (${percent}%)`;
            }
        };

        reader.onload = function() {
            const base64Content = reader.result.split(',')[1];
            
            progressStatus.textContent = 'Đang tải dữ liệu lên GitHub via REST API...';
            progressBarFill.style.width = '30%';

            const payload = JSON.stringify({
                message: `Upload image: ${fileName}`,
                content: base64Content
            });

            // Stage 2: AJAX Uploading using XMLHttpRequest
            const xhr = new XMLHttpRequest();
            const targetUrl = `https://api.github.com/repos/${username}/${repo}/contents/${fileName}`;

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const uploadPercent = Math.round((e.loaded / e.total) * 70);
                    const totalPercent = 30 + uploadPercent;
                    progressBarFill.style.width = totalPercent + '%';
                    progressStats.textContent = `${formatBytes(e.loaded)} / ${formatBytes(e.total)} (${totalPercent}%)`;
                }
            };

            xhr.onload = function() {
                uploadBtn.disabled = false;
                if (xhr.status === 200 || xhr.status === 201) {
                    progressBarFill.style.width = '100%';
                    progressStatus.textContent = 'Tải lên hoàn tất!';
                    progressStats.textContent = `${formatBytes(totalSize)} / ${formatBytes(totalSize)} (100%)`;

                    const cdnUrl = `https://cdn.jsdelivr.net/gh/${username}/${repo}@main/${fileName}`;
                    
                    setTimeout(() => {
                        progressBox.style.display = 'none';
                        document.getElementById('cdnUrlInput').value = cdnUrl;
                        document.getElementById('previewImg').src = cdnUrl;
                        resultBox.style.display = 'block';
                    }, 400);

                } else {
                    progressBox.style.display = 'none';
                    try {
                        const err = JSON.parse(xhr.responseText);
                        showError(`GitHub Error [${xhr.status}]: ${err.message || 'Tải lên thất bại'}`);
                    } catch(e) {
                        showError(`Lỗi hệ thống [${xhr.status}]: Tải lên thất bại`);
                    }
                }
            };

            xhr.onerror = function() {
                uploadBtn.disabled = false;
                progressBox.style.display = 'none';
                showError('Lỗi kết nối mạng.');
            };

            xhr.open('PUT', targetUrl, true);
            xhr.setRequestHeader('Authorization', `token ${token}`);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(payload);
        };

        reader.onerror = function() {
            uploadBtn.disabled = false;
            progressBox.style.display = 'none';
            showError('Lỗi khi đọc file từ đĩa.');
        };

        reader.readAsDataURL(file);
    }

    function showError(msg) {
        const errorMsg = document.getElementById('errorMessage');
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }

    function copyCdnUrl() {
        const cdnInput = document.getElementById('cdnUrlInput');
        const copyBtn = document.getElementById('copyBtn');
        
        cdnInput.select();
        navigator.clipboard.writeText(cdnInput.value);

        copyBtn.textContent = 'Đã Copy!';
        copyBtn.style.backgroundColor = '#10b981';
        
        setTimeout(() => {
            copyBtn.textContent = 'Copy Link';
            copyBtn.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
        }, 2000);
    }
</script>

</body>
</html>
